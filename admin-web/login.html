<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin login — dtunnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="top-app-bar">
    <a href="https://dtunnel.desarrollado.com/" class="logo"><span class="material-symbols-outlined filled">hub</span> dtunnel <span class="admin-badge">admin</span></a>
  </header>
  <main class="auth-page">
    <h1>Administración</h1>
    <p class="text-muted" style="margin-bottom:1rem;font-size:0.9rem">Solo cuentas con permisos de administrador.</p>

    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <p id="msg" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>

    <form id="twofa-form" class="auth-form" hidden>
      <p class="text-muted" style="margin-bottom:1rem;font-size:0.9rem">Introduce el código de tu app de autenticación.</p>
      <div class="form-group">
        <label for="twofa-code">Código 2FA</label>
        <input type="text" id="twofa-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="8" required autocomplete="one-time-code" placeholder="000000">
      </div>
      <div class="form-group">
        <label for="backup-code">O código de respaldo</label>
        <input type="text" id="backup-code" autocomplete="off" placeholder="Opcional">
      </div>
      <p id="twofa-msg" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Verificar</button>
      <button type="button" class="btn btn-ghost btn-block" id="twofa-back" style="margin-top:0.5rem">Volver</button>
    </form>
  </main>
  <script type="module">
    import { API_BASE } from './js/config.js';
    if (localStorage.getItem('dtunnel_token')) {
      window.location.href = '/admin.html';
    }
    let pending2fa = null;

    function finishLogin(data) {
      if (!data.isAdmin) throw new Error('Esta cuenta no tiene permisos de administrador');
      localStorage.setItem('dtunnel_token', data.token);
      localStorage.setItem('dtunnel_email', data.email);
      window.location.href = '/admin.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.hidden = true;
      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        if (data.requires2fa) {
          pending2fa = data.tempToken;
          document.getElementById('login-form').hidden = true;
          document.getElementById('twofa-form').hidden = false;
          document.getElementById('twofa-code').focus();
          return;
        }
        finishLogin(data);
      } catch (err) {
        msg.textContent = err.message;
        msg.hidden = false;
      }
    });

    document.getElementById('twofa-back').addEventListener('click', () => {
      pending2fa = null;
      document.getElementById('twofa-form').hidden = true;
      document.getElementById('login-form').hidden = false;
    });

    document.getElementById('twofa-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('twofa-msg');
      msg.hidden = true;
      try {
        const backup = document.getElementById('backup-code').value.trim();
        const res = await fetch(`${API_BASE}/auth/2fa/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tempToken: pending2fa,
            code: document.getElementById('twofa-code').value.trim(),
            backupCode: backup || undefined,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        finishLogin(data);
      } catch (err) {
        msg.textContent = err.message;
        msg.hidden = false;
      }
    });
  </script>
  <script src="/js/theme.js"></script>
</body>
</html>
