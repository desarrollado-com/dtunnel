<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña — dtunnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script type="importmap">{"imports":{"@material/web/":"https://esm.run/@material/web/"}}</script>
  <script type="module" src="/js/m3.js"></script>
</head>
<body>
  <header class="top-app-bar">
    <a href="/" class="logo"><span class="material-symbols-outlined filled">hub</span> dtunnel</a>
  </header>
  <main class="auth-page">
    <h1>Nueva contraseña</h1>
    <form id="reset-form" class="auth-form">
      <md-outlined-text-field id="password" type="password" label="Nueva contraseña (mín. 8)" required minlength="8"></md-outlined-text-field>
      <md-outlined-text-field id="password2" type="password" label="Confirmar contraseña" required minlength="8"></md-outlined-text-field>
      <p id="msg" class="form-error" hidden></p>
      <p id="ok" class="form-success" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Guardar</button>
    </form>
    <p class="text-muted" style="margin-top:1rem;font-size:0.9rem">
      <a href="/login.html">Iniciar sesión</a>
    </p>
  </main>
  <footer class="footer" data-site-footer></footer>
  <script src="/js/site-footer.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      document.getElementById('msg').textContent = 'Enlace inválido: falta el token.';
      document.getElementById('msg').hidden = false;
      document.getElementById('reset-form').hidden = true;
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const ok = document.getElementById('ok');
      msg.hidden = true;
      ok.hidden = true;
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      if (password !== password2) {
        msg.textContent = 'Las contraseñas no coinciden';
        msg.hidden = false;
        return;
      }
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        ok.textContent = 'Contraseña actualizada. Ya puedes iniciar sesión.';
        ok.hidden = false;
        document.getElementById('reset-form').hidden = true;
      } catch (err) {
        msg.textContent = err.message;
        msg.hidden = false;
      }
    });
  </script>
  <script src="/js/theme.js"></script>
</body>
</html>
