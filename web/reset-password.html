<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña — dtunnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="ws-auth-body">
  <div class="ws-auth-shell">
    <div class="ws-auth-brand">
      <a href="/" class="ws-sidebar-brand">
        <span class="material-symbols-outlined filled">hub</span>
        <div>
          <strong>dtunnel</strong>
          <small>Mi cuenta</small>
        </div>
      </a>
      <p class="ws-auth-tagline">
        Elige una contraseña segura de al menos 8 caracteres.
      </p>
    </div>

    <main class="ws-auth-panel">
      <div class="ws-card ws-auth-card">
        <h1>Nueva contraseña</h1>
        <form id="reset-form" class="auth-form">
          <label class="form-group">
            <span>Nueva contraseña (mín. 8)</span>
            <input type="password" id="password" required minlength="8" autocomplete="new-password" class="admin-search" style="width:100%">
          </label>
          <label class="form-group">
            <span>Confirmar contraseña</span>
            <input type="password" id="password2" required minlength="8" autocomplete="new-password" class="admin-search" style="width:100%">
          </label>
          <p id="msg" class="form-error" hidden></p>
          <p id="ok" class="form-success" hidden></p>
          <button type="submit" class="btn btn-primary btn-block">Guardar</button>
        </form>
        <p class="auth-links">
          <a href="/login.html">Iniciar sesión</a>
        </p>
      </div>
    </main>
  </div>

  <button type="button" class="theme-fab" id="theme-toggle" aria-label="Cambiar tema">
    <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
  </button>

  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      document.getElementById('msg').textContent = 'Enlace inválido: falta el token.';
      document.getElementById('msg').hidden = false;
      document.getElementById('reset-form').hidden = true;
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const ok = document.getElementById('ok');
      msg.hidden = true;
      ok.hidden = true;
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      if (password !== password2) {
        msg.textContent = 'Las contraseñas no coinciden';
        msg.hidden = false;
        return;
      }
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        ok.textContent = 'Contraseña actualizada. Ya puedes iniciar sesión.';
        ok.hidden = false;
        document.getElementById('reset-form').hidden = true;
      } catch (err) {
        msg.textContent = err.message;
        msg.hidden = false;
      }
    });
  </script>
  <script src="/js/theme.js"></script>
</body>
</html>
