<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse — dtunnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script type="importmap">{"imports":{"@material/web/":"https://esm.run/@material/web/"}}</script>
  <script type="module" src="/js/m3.js"></script>
</head>
<body>
  <header class="top-app-bar">
    <a href="/" class="logo"><span class="material-symbols-outlined filled">hub</span> dtunnel</a>
    <nav class="nav">
      <a href="/">Inicio</a>
      <a href="/login.html">Iniciar sesión</a>
    </nav>
  </header>
  <main class="auth-page">
    <h1>Crear cuenta</h1>
    <p class="text-muted" style="margin-bottom:1rem;font-size:0.9rem">URLs persistentes y subdominios reservados.</p>
    <form id="register-form" class="auth-form">
      <md-outlined-text-field id="email" type="email" label="Email" required></md-outlined-text-field>
      <md-outlined-text-field id="password" type="password" label="Contraseña (mín. 8)" required minlength="8"></md-outlined-text-field>
      <p id="msg" class="form-error" hidden></p>
      <md-filled-button type="submit" style="width:100%">Registrarse</md-filled-button>
    </form>
    <p class="text-muted" style="margin-top:1rem;font-size:0.9rem">
      ¿Ya tienes cuenta? <a href="/login.html">Iniciar sesión</a>
    </p>
  </main>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.hidden = true;
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        localStorage.setItem('dtunnel_token', data.token);
        localStorage.setItem('dtunnel_email', data.email);
        window.location.href = '/dashboard.html';
      } catch (err) {
        msg.textContent = err.message;
        msg.hidden = false;
      }
    });
  </script>
  <script src="/js/theme.js"></script>
</body>
</html>
