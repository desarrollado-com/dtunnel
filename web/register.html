<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse — dtunnel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <a href="/" class="logo">dtunnel</a>
    <nav class="nav">
      <a href="/">Inicio</a>
      <a href="/login.html">Iniciar sesión</a>
    </nav>
  </header>
  <main class="auth-page">
    <h1>Crear cuenta</h1>
    <p style="color:var(--muted);margin-bottom:1rem;font-size:0.9rem">
      URLs persistentes y subdominios reservados.
    </p>
    <form id="register-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Contraseña (mín. 8)</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password">
      </div>
      <p id="msg" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary" style="width:100%">Registrarse</button>
    </form>
    <p style="margin-top:1rem;color:var(--muted);font-size:0.9rem">
      ¿Ya tienes cuenta? <a href="/login.html">Iniciar sesión</a>
    </p>
  </main>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.hidden = true;
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        localStorage.setItem('dtunnel_token', data.token);
        localStorage.setItem('dtunnel_email', data.email);
        window.location.href = '/dashboard.html';
      } catch (err) {
        msg.textContent = err.message;
        msg.hidden = false;
      }
    });
  </script>
</body>
</html>
