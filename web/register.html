<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse — dtunnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="ws-auth-body">
  <div class="ws-auth-shell">
    <div class="ws-auth-brand">
      <a href="/" class="ws-sidebar-brand">
        <span class="material-symbols-outlined filled">hub</span>
        <div>
          <strong>dtunnel</strong>
          <small>Mi cuenta</small>
        </div>
      </a>
      <p class="ws-auth-tagline">
        Crea tu cuenta gratis. Reserva un subdominio fijo y ábrelo con el CLI cuando lo necesites.
      </p>
      <div class="ws-auth-footer-links">
        <a href="/docs.html">Documentación</a>
        ·
        <a href="/login.html">Iniciar sesión</a>
      </div>
    </div>

    <main class="ws-auth-panel">
      <div class="ws-card ws-auth-card">
        <h1>Crear cuenta</h1>
        <p class="auth-lead">Plan gratuito incluido. Verifica tu email para activar la cuenta.</p>
        <form id="register-form" class="auth-form">
          <label class="form-group">
            <span>Email</span>
            <input type="email" id="email" required autocomplete="username" class="admin-search" style="width:100%">
          </label>
          <label class="form-group">
            <span>Contraseña (mín. 8)</span>
            <input type="password" id="password" required minlength="8" autocomplete="new-password" class="admin-search" style="width:100%">
          </label>
          <label class="ws-auth-check">
            <input type="checkbox" id="accept-terms" required>
            <span>Acepto los <a href="/terminos.html" target="_blank" rel="noopener">Términos</a>, la <a href="/privacidad.html" target="_blank" rel="noopener">Privacidad</a> y el <a href="/uso-aceptable.html" target="_blank" rel="noopener">Uso aceptable</a>.</span>
          </label>
          <p id="msg" class="form-error" hidden></p>
          <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
        </form>
        <p class="auth-links">
          ¿Ya tienes cuenta? <a href="/login.html">Iniciar sesión</a>
        </p>
      </div>
    </main>
  </div>

  <button type="button" class="theme-fab" id="theme-toggle" aria-label="Cambiar tema">
    <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
  </button>

  <script>
    if (localStorage.getItem('dtunnel_token')) {
      window.location.href = '/dashboard.html#/overview';
    }
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.hidden = true;
      if (!document.getElementById('accept-terms').checked) {
        msg.textContent = 'Debes aceptar los términos para registrarte.';
        msg.hidden = false;
        return;
      }
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        if (!data.emailVerified) {
          sessionStorage.setItem('dtunnel_pending_email', data.email);
          window.location.href = '/verify-pending.html';
          return;
        }
        localStorage.setItem('dtunnel_token', data.token);
        localStorage.setItem('dtunnel_email', data.email);
        window.location.href = '/dashboard.html#/overview';
      } catch (err) {
        msg.textContent = err.message;
        msg.hidden = false;
      }
    });
  </script>
  <script src="/js/theme.js"></script>
</body>
</html>
