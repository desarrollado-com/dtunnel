<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago recibido — dtunnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="ws-auth-body">
  <div class="ws-auth-shell" style="grid-template-columns:1fr;max-width:480px;text-align:center">
    <main class="ws-auth-panel">
      <div class="ws-card ws-auth-card">
        <span class="material-symbols-outlined filled" style="font-size:2.5rem;color:var(--md-sys-color-primary)">check_circle</span>
        <h1 style="margin-top:1rem">Procesando pago</h1>
        <p id="msg" class="auth-lead">Si completaste el pago en Wompi, tu plan se activará en unos segundos.</p>
        <a href="/dashboard.html#/billing" class="btn btn-primary" style="margin-top:1.5rem;display:inline-flex">Ir al dashboard</a>
      </div>
    </main>
  </div>
  <button type="button" class="theme-fab" id="theme-toggle" aria-label="Cambiar tema">
    <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
  </button>
  <script>
    const ref = new URLSearchParams(location.search).get('ref');
    if (ref) document.getElementById('msg').textContent = `Referencia: ${ref}. Tu plan se activará tras la confirmación de Wompi.`;
  </script>
  <script src="/js/theme.js"></script>
</body>
</html>
