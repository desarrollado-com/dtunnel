<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — dtunnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script type="importmap">{"imports":{"@material/web/":"https://esm.run/@material/web/"}}</script>
  <script type="module" src="/js/m3.js"></script>
</head>
<body>
  <header class="top-app-bar">
    <a href="/" class="logo"><span class="material-symbols-outlined filled">hub</span> dtunnel</a>
    <nav class="nav">
      <a href="/">Inicio</a>
      <a href="/register.html">Registrarse</a>
    </nav>
  </header>
  <main class="auth-page">
    <h1>Iniciar sesión</h1>
    <form id="login-form" class="auth-form">
      <md-outlined-text-field id="email" type="email" label="Email" required></md-outlined-text-field>
      <md-outlined-text-field id="password" type="password" label="Contraseña" required></md-outlined-text-field>
      <p style="margin:-0.25rem 0 0.5rem;font-size:0.9rem;text-align:right">
        <a href="/forgot-password.html">¿Olvidaste tu contraseña?</a>
      </p>
      <p id="msg" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
    <p class="text-muted" style="margin-top:1rem;font-size:0.9rem">
      ¿Sin cuenta? <a href="/register.html">Registrarse</a>
    </p>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.hidden = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (res.status === 403 && data.code === 'EMAIL_NOT_VERIFIED') {
          sessionStorage.setItem('dtunnel_pending_email', document.getElementById('email').value);
          window.location.href = '/verify-pending.html';
          return;
        }
        if (!res.ok) throw new Error(data.error || 'Error');
        localStorage.setItem('dtunnel_token', data.token);
        localStorage.setItem('dtunnel_email', data.email);
        localStorage.setItem('dtunnel_is_admin', data.isAdmin ? '1' : '0');
        const next = new URLSearchParams(window.location.search).get('next');
        const adminUrl = 'https://dtunnel-admin.desarrollado.com/admin.html';
        window.location.href = next || (data.isAdmin ? adminUrl : '/dashboard.html');
      } catch (err) {
        msg.textContent = err.message;
        msg.hidden = false;
      }
    });
  </script>
  <footer class="footer" data-site-footer></footer>
  <script src="/js/site-footer.js"></script>
  <script src="/js/theme.js"></script>
</body>
</html>
