<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — dtunnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="ws-auth-body">
  <div class="ws-auth-shell">
    <div class="ws-auth-brand">
      <a href="/" class="ws-sidebar-brand">
        <span class="material-symbols-outlined filled">hub</span>
        <div>
          <strong>dtunnel</strong>
          <small>Mi cuenta</small>
        </div>
      </a>
      <p class="ws-auth-tagline">
        Accede a tu panel: subdominios, túneles activos, tráfico en vivo y planes.
      </p>
      <div class="ws-auth-footer-links">
        <a href="/docs.html">Documentación</a>
        ·
        <a href="/status.html">Estado</a>
      </div>
    </div>

    <main class="ws-auth-panel">
      <div class="ws-card ws-auth-card">
        <h1>Iniciar sesión</h1>
        <p class="auth-lead">Entra con tu email y contraseña.</p>
        <form id="login-form" class="auth-form">
          <label class="form-group">
            <span>Email</span>
            <input type="email" id="email" required autocomplete="username" class="admin-search" style="width:100%">
          </label>
          <label class="form-group">
            <span>Contraseña</span>
            <input type="password" id="password" required autocomplete="current-password" class="admin-search" style="width:100%">
          </label>
          <p style="margin:-0.25rem 0 0;font-size:0.9rem;text-align:right">
            <a href="/forgot-password.html">¿Olvidaste tu contraseña?</a>
          </p>
          <p id="msg" class="form-error" hidden></p>
          <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>
        <p class="auth-links">
          ¿Sin cuenta? <a href="/register.html">Registrarse</a>
        </p>
      </div>
    </main>
  </div>

  <button type="button" class="theme-fab" id="theme-toggle" aria-label="Cambiar tema">
    <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
  </button>

  <script>
    if (localStorage.getItem('dtunnel_token')) {
      window.location.href = '/dashboard.html#/overview';
    }
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.hidden = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (res.status === 403 && data.code === 'EMAIL_NOT_VERIFIED') {
          sessionStorage.setItem('dtunnel_pending_email', document.getElementById('email').value);
          window.location.href = '/verify-pending.html';
          return;
        }
        if (!res.ok) throw new Error(data.error || 'Error');
        localStorage.setItem('dtunnel_token', data.token);
        localStorage.setItem('dtunnel_email', data.email);
        localStorage.setItem('dtunnel_is_admin', data.isAdmin ? '1' : '0');
        const next = new URLSearchParams(window.location.search).get('next');
        const adminUrl = 'https://dtunnel-admin.desarrollado.com/admin.html';
        window.location.href = next || (data.isAdmin ? adminUrl : '/dashboard.html#/overview');
      } catch (err) {
        msg.textContent = err.message;
        msg.hidden = false;
      }
    });
  </script>
  <script src="/js/theme.js"></script>
</body>
</html>
