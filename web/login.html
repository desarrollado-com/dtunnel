<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — dtunnel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <a href="/" class="logo">dtunnel</a>
    <nav class="nav">
      <a href="/">Inicio</a>
      <a href="/register.html">Registrarse</a>
    </nav>
  </header>
  <main class="auth-page">
    <h1>Iniciar sesión</h1>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <p id="msg" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary" style="width:100%">Entrar</button>
    </form>
    <p style="margin-top:1rem;color:var(--muted);font-size:0.9rem">
      ¿Sin cuenta? <a href="/register.html">Registrarse</a>
    </p>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.hidden = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        localStorage.setItem('dtunnel_token', data.token);
        localStorage.setItem('dtunnel_email', data.email);
        localStorage.setItem('dtunnel_is_admin', data.isAdmin ? '1' : '0');
        const next = new URLSearchParams(window.location.search).get('next');
        window.location.href = next || (data.isAdmin ? '/admin.html' : '/dashboard.html');
      } catch (err) {
        msg.textContent = err.message;
        msg.hidden = false;
      }
    });
  </script>
</body>
</html>
