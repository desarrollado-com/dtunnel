<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta — dtunnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="ws-body">
  <div class="ws-shell">
    <aside class="ws-sidebar" id="ws-sidebar">
      <div class="ws-sidebar-brand">
        <span class="material-symbols-outlined filled">hub</span>
        <div>
          <strong>dtunnel</strong>
          <small>Mi cuenta</small>
        </div>
      </div>
      <nav class="ws-nav" id="ws-nav"></nav>
      <div class="ws-sidebar-footer">
        <a href="/docs.html" target="_blank" rel="noopener">Documentación</a>
        ·
        <a href="/status.html" target="_blank" rel="noopener">Estado</a>
        <br>
        <a id="admin-external-link" href="https://dtunnel-admin.desarrollado.com/" target="_blank" rel="noopener" hidden>Panel admin</a>
      </div>
    </aside>

    <div class="ws-main">
      <header class="ws-topbar">
        <button type="button" class="ws-sidebar-toggle" id="sidebar-toggle" aria-label="Menú">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <nav class="ws-breadcrumb" id="ws-breadcrumb" aria-label="Ruta"></nav>
        <div class="ws-topbar-actions">
          <span class="ws-user-chip" id="user-email"></span>
          <button type="button" class="btn btn-ghost btn-sm" id="logout-btn">Salir</button>
        </div>
      </header>

      <main class="ws-content">
        <section class="ws-panel active" id="panel-overview" data-route="overview"></section>
        <section class="ws-panel" id="panel-subdomains" data-route="subdomains"></section>
        <section class="ws-panel" id="panel-tunnels" data-route="tunnels"></section>
        <section class="ws-panel" id="panel-traces" data-route="traces"></section>
        <section class="ws-panel" id="panel-billing" data-route="billing"></section>
        <section class="ws-panel" id="panel-security" data-route="security"></section>
        <section class="ws-panel" id="panel-cli" data-route="cli"></section>
      </main>
    </div>
  </div>

  <div class="ws-toast-container" id="toast-container"></div>

  <button type="button" class="theme-fab" id="theme-toggle" aria-label="Cambiar tema">
    <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
  </button>

  <script type="module" src="/js/app.js"></script>
  <script src="/js/theme.js"></script>
</body>
</html>
