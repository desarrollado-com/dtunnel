<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta — dtunnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script type="importmap">{"imports":{"@material/web/":"https://esm.run/@material/web/"}}</script>
  <script type="module" src="/js/m3.js"></script>
</head>
<body>
  <header class="top-app-bar">
    <a href="/" class="logo"><span class="material-symbols-outlined filled">hub</span> dtunnel</a>
    <nav class="nav">
      <a href="/docs.html">Documentación</a>
      <a href="#" id="logout">Cerrar sesión</a>
    </nav>
  </header>
  <main class="section">
    <h1>Mi cuenta</h1>
    <p id="email" class="text-muted" style="margin-bottom:0.5rem"></p>
    <p id="plan-info" class="text-muted" style="margin-bottom:2rem"></p>
    <p id="admin-link" hidden style="margin-bottom:2rem">
      <a href="/admin.html" class="btn btn-outlined">Panel de administración</a>
    </p>

    <h2>Reservar subdominio</h2>
    <form id="reserve-form" class="auth-form" style="max-width:400px;margin-bottom:2rem">
      <md-outlined-text-field id="name" label="Nombre (ej. mi-api)" pattern="[a-z0-9-]{3,32}" required></md-outlined-text-field>
      <p id="reserve-msg" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary">Reservar</button>
    </form>

    <h2>Mis subdominios</h2>
    <ul id="subdomains" style="list-style:none"></ul>

    <h2 style="margin-top:2rem">Usar en CLI</h2>
    <pre><code>dtunnel login
dtunnel reserve mi-api
dtunnel --port 88080 --subdomain mi-api</code></pre>
  </main>
  <script>
    const token = localStorage.getItem('dtunnel_token');
    if (!token) window.location.href = '/login.html';

    const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };

    async function loadMe() {
      const res = await fetch('/api/me', { headers });
      if (!res.ok) { window.location.href = '/login.html'; return; }
      const data = await res.json();
      document.getElementById('email').textContent = data.email;
      document.getElementById('plan-info').textContent =
        `Plan: ${data.planName || data.plan} · Túneles: ${data.limits?.tunnelLimit ?? '—'} · Subdominios: ${data.limits?.reservedSubdomainLimit ?? '—'}`;
      if (data.isAdmin) document.getElementById('admin-link').hidden = false;
      const ul = document.getElementById('subdomains');
      ul.innerHTML = data.subdomains.length
        ? data.subdomains.map(s => `<li><a href="https://${s}.dtunnel.desarrollado.com">${s}.dtunnel.desarrollado.com</a></li>`).join('')
        : '<li class="text-muted">Ninguno reservado aún</li>';
    }

    document.getElementById('reserve-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('reserve-msg');
      msg.hidden = true;
      try {
        const res = await fetch('/api/subdomains/reserve', {
          method: 'POST',
          headers,
          body: JSON.stringify({ name: document.getElementById('name').value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        loadMe();
        document.getElementById('name').value = '';
      } catch (err) {
        msg.textContent = err.message;
        msg.hidden = false;
      }
    });

    document.getElementById('logout').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('dtunnel_token');
      localStorage.removeItem('dtunnel_email');
      window.location.href = '/';
    });

    loadMe();
  </script>
  <script src="/js/theme.js"></script>
</body>
</html>
