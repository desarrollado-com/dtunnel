<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña — dtunnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script type="importmap">{"imports":{"@material/web/":"https://esm.run/@material/web/"}}</script>
  <script type="module" src="/js/m3.js"></script>
</head>
<body>
  <header class="top-app-bar">
    <a href="/" class="logo"><span class="material-symbols-outlined filled">hub</span> dtunnel</a>
    <nav class="nav">
      <a href="/login.html">Iniciar sesión</a>
    </nav>
  </header>
  <main class="auth-page">
    <h1>Recuperar contraseña</h1>
    <p class="text-muted" style="margin-bottom:1rem;font-size:0.9rem">
      Te enviaremos un enlace por email si la cuenta existe.
    </p>
    <form id="forgot-form" class="auth-form">
      <md-outlined-text-field id="email" type="email" label="Email" required></md-outlined-text-field>
      <p id="msg" class="form-error" hidden></p>
      <p id="ok" class="form-success" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Enviar enlace</button>
    </form>
    <p class="text-muted" style="margin-top:1rem;font-size:0.9rem">
      <a href="/login.html">Volver al inicio de sesión</a>
    </p>
  </main>
  <footer class="footer" data-site-footer></footer>
  <script src="/js/site-footer.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const ok = document.getElementById('ok');
      msg.hidden = true;
      ok.hidden = true;
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        ok.textContent = data.message || 'Si el email existe, recibirás un enlace de recuperación.';
        ok.hidden = false;
        document.getElementById('forgot-form').querySelector('button').disabled = true;
      } catch (err) {
        msg.textContent = err.message;
        msg.hidden = false;
      }
    });
  </script>
  <script src="/js/theme.js"></script>
</body>
</html>
