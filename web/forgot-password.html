<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña — dtunnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="ws-auth-body">
  <div class="ws-auth-shell">
    <div class="ws-auth-brand">
      <a href="/" class="ws-sidebar-brand">
        <span class="material-symbols-outlined filled">hub</span>
        <div>
          <strong>dtunnel</strong>
          <small>Mi cuenta</small>
        </div>
      </a>
      <p class="ws-auth-tagline">
        Te enviaremos un enlace de recuperación si la cuenta existe.
      </p>
      <div class="ws-auth-footer-links">
        <a href="/login.html">Volver al inicio de sesión</a>
      </div>
    </div>

    <main class="ws-auth-panel">
      <div class="ws-card ws-auth-card">
        <h1>Recuperar contraseña</h1>
        <form id="forgot-form" class="auth-form">
          <label class="form-group">
            <span>Email</span>
            <input type="email" id="email" required autocomplete="username" class="admin-search" style="width:100%">
          </label>
          <p id="msg" class="form-error" hidden></p>
          <p id="ok" class="form-success" hidden></p>
          <button type="submit" class="btn btn-primary btn-block">Enviar enlace</button>
        </form>
        <p class="auth-links">
          <a href="/login.html">Iniciar sesión</a>
        </p>
      </div>
    </main>
  </div>

  <button type="button" class="theme-fab" id="theme-toggle" aria-label="Cambiar tema">
    <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
  </button>

  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const ok = document.getElementById('ok');
      msg.hidden = true;
      ok.hidden = true;
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        ok.textContent = data.message || 'Si el email existe, recibirás un enlace de recuperación.';
        ok.hidden = false;
        document.getElementById('forgot-form').querySelector('button').disabled = true;
      } catch (err) {
        msg.textContent = err.message;
        msg.hidden = false;
      }
    });
  </script>
  <script src="/js/theme.js"></script>
</body>
</html>
